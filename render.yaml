# Render "Blueprint": crea el backend de STAGING con esta configuración.
# En Render: New → Blueprint → elegir este repo. Las variables con "sync: false" las pide
# Render al crear el servicio (son secretos: se cargan ahí, nunca en el repo).
# Guía completa: docs/DEPLOY.md
services:
  - type: web
    name: tiendadearte-api-staging
    runtime: node
    plan: free
    rootDir: backend
    branch: main
    buildCommand: npm ci
    # El seed es idempotente: crea el superadmin (si falta) y las obras de muestra (si la base está vacía)
    startCommand: npm run start:render
    healthCheckPath: /api/v1
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: SEED_OBRAS
        value: "true"
      - key: RESERVA_MINUTOS
        value: "30"
      - key: CLOUDINARY_CARPETA
        value: tienda-arte/staging
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      # --- Secretos y URLs: Render los pide al crear el Blueprint ---
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_TO
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
